name: Provision infrastructure

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type provision to create/update Azure resources after reviewing the template'
        required: true
        type: string

permissions:
  contents: read

jobs:
  provision:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'provision'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-infrastructure
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_PROVISION_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate deployment template
        run: az bicep build --file infra/main.bicep --outfile "${{ runner.temp }}/infra.json"
      - name: Preview and provision
        env:
          RG: ${{ secrets.RESOURCE_GROUP }}
          APP_NAME: ${{ secrets.APP_NAME }}
          LOCATION: ${{ secrets.AZURE_LOCATION }}
          SWA_LOCATION: ${{ secrets.SWA_LOCATION }}
          WEB_DOMAIN: ${{ secrets.WEB_DOMAIN }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          DEPLOYER_PRINCIPAL_ID: ${{ secrets.PROVISION_PRINCIPAL_ID }}
          DEPLOYER_PRINCIPAL_TYPE: ServicePrincipal
        run: |
          scripts/deploy.sh infra
          scripts/deploy.sh site
