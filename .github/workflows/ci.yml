name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: functions/requirements.txt
      - name: Install test dependencies
        run: |
          npm ci --ignore-scripts
          python -m pip install -r functions/requirements.txt pytest
      - name: Test dashboard, build configuration, maps, and pipeline
        run: |
          npm test
          python -m pytest -q tests
          bash -n scripts/deploy.sh
      - name: Build deployment-neutral web files
        run: npm run build
      - name: Compile infrastructure
        run: az bicep build --file infra/main.bicep --outfile "${{ runner.temp }}/infra.json"
      - name: Scan complete Git history for credentials
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml --log-opts="--all" .
      - name: Upload deployment-neutral build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-preview
          path: dist/
          retention-days: 3

  deploy-web:
    name: Deploy web
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_WEB_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      DEPLOYMENT_HOSTNAME: ${{ secrets.AZURE_STATIC_WEB_APPS_HOSTNAME }}
    concurrency:
      group: production-web
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build using private deployment settings
        env:
          DATA_BASE_URL: ${{ secrets.DATA_BASE_URL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          NAVER_SITE_VERIFICATION: ${{ secrets.NAVER_SITE_VERIFICATION }}
          BING_SITE_VERIFICATION: ${{ secrets.BING_SITE_VERIFICATION }}
          DEPLOYMENT_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${DEPLOYMENT_TOKEN:?Configure AZURE_STATIC_WEB_APPS_API_TOKEN}"
          : "${DATA_BASE_URL:?Configure DATA_BASE_URL}"
          : "${PUBLIC_SITE_URL:?Configure PUBLIC_SITE_URL}"
          node scripts/build-web.mjs
      - name: Deploy static web files
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
      - name: Verify website, robots, sitemap, and data
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          DATA_BASE_URL: ${{ secrets.DATA_BASE_URL }}
        run: node scripts/verify-deployment.mjs

  deploy-functions:
    name: Deploy collector
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.DEPLOY_FUNCTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production-functions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate collector deployment settings
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          FUNCTION_APP: ${{ secrets.FUNCTION_APP_NAME }}
        run: |
          : "${CLIENT_ID:?Configure AZURE_CLIENT_ID}"
          : "${TENANT_ID:?Configure AZURE_TENANT_ID}"
          : "${SUBSCRIPTION_ID:?Configure AZURE_SUBSCRIPTION_ID}"
          : "${FUNCTION_APP:?Configure FUNCTION_APP_NAME}"
      - uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@c27ade7ab0db7a7005f1ee0c6aed9fae27ca4249 # v1
        with:
          app-name: ${{ secrets.FUNCTION_APP_NAME }}
          package: functions
          sku: flexconsumption
          remote-build: true
